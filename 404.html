<div class="home" style="padding: 6vh 0; text-align: center; position: relative;">
  
  <div style="position: relative; width: 100%; max-width: 640px; height: 320px; margin: 0 auto;">
    <canvas id="errorCanvas" width="1280" height="640" style="width: 100%; height: 100%;"></canvas>
    
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; width: 100%;">
      <h1 style="font-size: 7rem; font-weight: 200; line-height: 1; color: rgba(42, 122, 226, 0.85); margin: 0 0 0.5rem 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.02em;">
        404
      </h1>
      <p style="font-size: 0.9rem; font-weight: 400; letter-spacing: 0.25em; color: rgba(17, 17, 17, 0.6); margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
        ページがありません
      </p>
    </div>
  </div>

  <div class="post-content" style="color: #828282; font-size: 0.95rem; margin-top: 1.5rem; margin-bottom: 3rem;">
    <p>ページが削除、またはアドレスが変更された可能性があります。</p>
  </div>

  <div>
    <a href="{{ '/' | relative_url }}" style="display: inline-block; font-size: 0.9rem; font-weight: 400; color: #2a7ae2; text-decoration: none; border: 1px solid #2a7ae2; padding: 12px 32px; border-radius: 24px; transition: all 0.2s;">
      トップページへ戻る
    </a>
  </div>
</div>

<script>window.addEventListener('DOMContentLoaded', function() {
  const canvas = document.getElementById('errorCanvas');
  const ctx = canvas.getContext('2d');
  
  const width = canvas.width;
  const height = canvas.height;
  const centerY = height * 0.55; // 404の文字の高さに合わせる
  
  // --- 背景色を安全に取得・不透明化 
  const bodyStyle = window.getComputedStyle(document.body);
  let bgColor = bodyStyle.backgroundColor || '#eaeaea';
  
  // 波と粒子の色はMinimaのブランドカラーで固定
  const brandColor = '#2a7ae2'; 
  
  // --- 粒子アニメーション用の設定 ---
  const particleCount = 40; 
  const startX = width * 0.65; // 画面中央付近から粒子を飛ばす
  const particles = [];
  
  // 簡易的な擬似乱数で初期配置を作成
  let seed = 42;
  function random() {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }
  
  // 粒子の初期データを配列に格納
  for (let i = 0; i < particleCount; i++) {
    const initialX = startX + random() * (width - startX + 100);
    const progress = (initialX - startX) / (width - startX);
    const spread = height * 0.25 * (progress + 0.2);
    const initialY = centerY + (random() + random() - 1) * spread;
    
    particles.push({
      x: initialX,
      baseY: initialY, // サイン波の基準となる中心Y座標
      size: 5 + random() * 4,
      speed: 0.24 + random() * 0.76, // 横への移動速度（2倍設定維持）
      angle: random() * Math.PI * 2,
      waveSpeed: 0.01 + random() * 0.02, // 上下の波（うねり）のスピード（2倍設定維持）
      waveAmp: 10 + random() * 20        // 上下に揺れる幅
    });
  }
  
  // アニメーションのループ関数
  function animate() {
    // 背景を塗る前に、確実に透明度を 1.0 (不透明) にリセットする
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, width, height);
    
    // 2. 減衰するサイン波を描画（元の形状・高さのまま固定）
    ctx.beginPath();
    ctx.strokeStyle = brandColor;
    ctx.lineWidth = 4;
    ctx.globalAlpha = 0.25; // 波の透明度
    
    const waveLength = width * 0.75; 
    for (let x = 0; x <= waveLength; x++) {
      const t = (x / waveLength) * 9; 
      const y = Math.sin(t) * Math.exp(-t * 0.18) * (height * 0.25);
      
      if (x === 0) {
        ctx.moveTo(x, centerY - y);
      } else {
        ctx.lineTo(x, centerY - y);
      }
    }
    ctx.stroke();
    
    // 3. データロストを表現するノイズ粒子を更新・描画
    ctx.globalAlpha = 0.18; // 粒子の透明度
    ctx.fillStyle = brandColor;
    
    for (let i = 0; i < particleCount; i++) {
      const p = particles[i];
      
      // 位置の更新
      p.x += p.speed;
      p.angle += p.waveSpeed;
      
      if (p.x > width + 50) {
        p.x = startX - (random() * 20);
        const progress = 0;
        const spread = height * 0.25 * (progress + 0.2);
        p.baseY = centerY + (random() + random() - 1) * spread;
        p.angle = random() * Math.PI * 2;
      }
      
      // ベースのY座標にサイン波の「うねり」を加える
      const currentProgress = (p.x - startX) / (width - startX);
      let renderY = p.baseY + Math.sin(p.angle) * p.waveAmp;

      if (currentProgress > 0) {
        p.baseY += (random() - 0.5) * (currentProgress * 1.0);
      }
      
      ctx.beginPath();
      ctx.arc(p.x, renderY, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // 次のフレームを要求
    requestAnimationFrame(animate);
  }
  
  // アニメーションを開始
  animate();
});

</script>
